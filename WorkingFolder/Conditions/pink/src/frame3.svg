            <image width="256" height="256" href="../../../../Resources/SNModding_LogoS.png"/>
            <image width="256" height="256" filter="url(#gear)" href="../../../../Resources/Gears_Animated/Gear_03.png"/>
        </g>
        <image width="256" height="256" filter="url(#bubbles)" href="bubbles.png"/>
